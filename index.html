<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>我的网页</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #1f2430; --muted: #6b7280;
    --primary: #2563eb; --primary-d: #1d4ed8; --success: #16a34a; --danger: #dc2626;
    --border: #e5e7eb; --radius: 14px;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.7; min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 28px 0 24px; }
  .brand h1 { font-size: clamp(24px, 5vw, 34px); font-weight: 800; }
  .brand p { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .nav-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 18px; border-radius: 10px; font-size: 15px; font-weight: 600;
    cursor: pointer; text-decoration: none; border: 1px solid transparent;
    transition: transform .06s ease, background .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,.3); }
  .btn-primary:hover { background: var(--primary-d); }
  .btn-ghost { background: #fff; color: var(--primary); border-color: #bfdbfe; }
  .btn-ghost:hover { background: #eff6ff; }
  .btn-danger { background: #fff; color: var(--danger); border-color: #fecaca; }
  .btn-danger:hover { background: #fef2f2; }
  .avatar {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; font-weight: 700;
  }
  .user-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 12px 5px 5px; background: #fff; border: 1px solid var(--border);
    border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow);
  }
  .notice {
    display: flex; gap: 12px; align-items: flex-start;
    background: linear-gradient(120deg, #eff6ff, #f5f3ff);
    border: 1px solid #dbeafe; border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 24px; font-size: 14px; color: #1e40af;
  }
  .section-title { font-size: 20px; font-weight: 700; margin: 8px 0 14px; }
  .card-list { display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
  .card h3 { font-size: 17px; margin-bottom: 6px; word-break: break-all; }
  .card .meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .card .body { font-size: 15px; color: #374151; white-space: pre-wrap; word-break: break-word; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .skeleton { height: 96px; border-radius: var(--radius); background: linear-gradient(90deg, #eef0f4 25%, #f7f8fa 50%, #eef0f4 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  footer { margin-top: 48px; text-align: center; color: var(--muted); font-size: 13px; }
  .mask { position: fixed; inset: 0; background: rgba(15,23,42,.5); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .mask.show { display: flex; }
  .modal { background: #fff; border-radius: 18px; padding: 28px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.25); animation: pop .18s ease; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } }
  .modal h3 { font-size: 19px; margin-bottom: 4px; }
  .modal .sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .modal input { width: 100%; padding: 12px 14px; margin: 6px 0; font-size: 15px; border: 1.5px solid var(--border); border-radius: 10px; outline: none; transition: border-color .15s, box-shadow .15s; }
  .modal input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .modal .submit { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; border: none; }
  .modal .switch { margin-top: 14px; text-align: center; font-size: 14px; color: var(--muted); }
  .modal .switch a { color: var(--primary); cursor: pointer; font-weight: 600; }
  .close { float: right; cursor: pointer; font-size: 22px; color: var(--muted); line-height: 1; }
  .tip { margin-top: 12px; font-size: 14px; min-height: 20px; text-align: center; }
  .tip.ok { color: var(--success); } .tip.err { color: var(--danger); }
  #toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px); background: #111827; color: #fff; padding: 11px 20px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 200; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 文章详情弹窗专属 */
  .article-modal { background: #fff; border-radius: 18px; padding: 28px; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); animation: pop .18s ease; }
  .article-modal h3 { font-size: 22px; margin-bottom: 6px; word-break: break-word; }
  .article-modal .art-meta { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .article-modal .art-body { white-space: pre-wrap; word-break: break-word; font-size: 15px; color: #374151; margin-bottom: 20px; }
  .article-modal hr { border: none; border-top: 1px solid #eee; margin: 20px 0 14px; }
  .article-modal h4 { font-size: 16px; margin-bottom: 10px; }
  .comment-item { border-top: 1px solid #f0f0f0; padding: 12px 0; }
  .comment-item .cm-meta { font-size: 13px; color: var(--muted); }
  .comment-item .cm-meta b { color: var(--text); }
  .comment-item .cm-body { margin-top: 5px; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .comment-item .cm-del { color: var(--danger); cursor: pointer; margin-left: 8px; font-size: 12px; }
  .cmt-textarea { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; resize: vertical; font-family: inherit; outline: none; }
  .cmt-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <h1>欢迎来到我的网站</h1>
      <p>用户注册 · 自由发文 · 社区内容</p>
    </div>
    <div class="nav-actions" id="navActions">
      <button class="btn btn-ghost" onclick="openModal('login')">登录</button>
      <button class="btn btn-primary" onclick="openModal('register')">注册</button>
    </div>
  </header>

  <div class="notice">
    <span>📢</span>
    <span>欢迎注册账号发布内容；请遵守法律法规与社区规范，违规内容将被下架，账号可能被限制。</span>
  </div>

  <h2 class="section-title">最新内容</h2>
  <div class="card-list" id="list">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>

  <footer>数据来自 Cloudflare Worker + D1 · &copy; 个人网站所有权</footer>
</div>

<!-- 登录/注册弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3 id="modalTitle">登录</h3>
    <div class="sub" id="modalSub">登录后可发布和管理文章</div>
    <div class="tip" id="tip"></div>
    <form id="modalForm">
      <input type="text" id="username" placeholder="用户名" autocomplete="username" required>
      <input type="password" id="password" placeholder="密码（至少8位）" autocomplete="current-password" required>
      <button class="btn btn-primary submit" type="submit" id="submitBtn">登录</button>
    </form>
    <div class="switch" id="switchLine"></div>
  </div>
</div>

<!-- 文章详情 + 评论弹窗 -->
<div class="mask" id="articleMask">
  <div class="article-modal">
    <span class="close" onclick="closeArticle()">&times;</span>
    <h3 id="artTitle">加载中…</h3>
    <div class="art-meta" id="artMeta"></div>
    <div class="art-body" id="artContent"></div>
    <hr>
    <h4>评论 <span id="cmtCount" style="color:#888;font-weight:400"></span></h4>
    <div id="cmtList"><div class="skeleton" style="height:56px"></div></div>
    <form id="cmtForm" style="margin-top:14px">
      <textarea id="cmtInput" class="cmt-textarea" rows="3" placeholder="说点什么……" maxlength="1000" required></textarea>
      <button class="btn btn-primary submit" type="submit" style="margin-top:8px;width:100%">发表评论</button>
    </form>
  </div>
</div>

<div id="toast"></div>

<script>
// ================== 配置 ==================
const API = "https://api.jifrshio.cc.cd";

// ================== 状态 ==================
let currentType = "login";
let me = null;
let currentArticleId = null;

// ================== 工具 ==================
const $ = (id) => document.getElementById(id);
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400);
}
function fmtTime(s) {
  if (!s) return "";
  const d = new Date(s);
  return isNaN(d) ? "" : d.toLocaleString("zh-CN", { hour12: false });
}
async function apiFetch(path, options = {}) {
  const headers = { "X-Requested-With": "fetch", ...(options.headers || {}) };
  const token = localStorage.getItem("token");
  if (token) headers["Authorization"] = `Bearer ${token}`;
  return fetch(API + path, { ...options, headers });
}

// ================== 登录/注册弹窗 ==================
function openModal(type) {
  currentType = type;
  $("tip").className = "tip"; $("tip").textContent = "";
  $("modalForm").reset();
  const isLogin = type === "login";
  $("modalTitle").textContent = isLogin ? "登录" : "注册";
  $("modalSub").textContent = isLogin ? "登录后可发布和管理文章" : "注册即可自由发文";
  $("submitBtn").textContent = isLogin ? "登录" : "注册";
  $("password").autocomplete = isLogin ? "current-password" : "new-password";
  $("switchLine").innerHTML = isLogin
    ? '没有账号？<a onclick="openModal(\'register\')">立即注册</a>'
    : '已有账号？<a onclick="openModal(\'login\')">直接登录</a>';
  $("mask").classList.add("show");
  setTimeout(() => $("username").focus(), 60);
}
function closeModal() { $("mask").classList.remove("show"); }
$("mask").addEventListener("click", e => { if (e.target === $("mask")) closeModal(); });

// ================== 文章详情弹窗 ==================
function closeArticle() {
  $("articleMask").classList.remove("show");
  currentArticleId = null;
}
$("articleMask").addEventListener("click", e => { if (e.target === $("articleMask")) closeArticle(); });

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeModal(); closeArticle(); }
});

async function openArticle(id) {
  currentArticleId = id;
  $("artTitle").textContent = "加载中…";
  $("artMeta").textContent = "";
  $("artContent").textContent = "";
  $("cmtCount").textContent = "";
  $("cmtList").innerHTML = `<div class="skeleton" style="height:56px"></div>`;
  $("cmtInput").value = "";
  $("articleMask").classList.add("show");

  try {
    const [aRes, cRes] = await Promise.all([
      fetch(API + "/api/article/" + id),
      fetch(API + "/api/article/" + id + "/comments"),
    ]);
    const aData = await aRes.json();
    const cData = await cRes.json();

    if (!aData.ok) {
      $("artTitle").textContent = "文章不存在";
      $("cmtList").innerHTML = "";
      return;
    }
    const a = aData.article;
    $("artTitle").textContent = a.title;
    $("artMeta").textContent = `作者：${a.username} ｜ ${fmtTime(a.created_at)}`;
    $("artContent").textContent = a.content;
    renderComments(cData.ok ? cData.comments : []);
  } catch (e) {
    $("artTitle").textContent = "加载失败";
    $("artContent").textContent = e.message;
    $("cmtList").innerHTML = "";
  }
}

function renderComments(list) {
  $("cmtCount").textContent = "(" + list.length + ")";
  if (!list.length) {
    $("cmtList").innerHTML = `<div style="color:#888;font-size:14px;padding:8px 0">还没有评论，来抢沙发～</div>`;
    return;
  }
  $("cmtList").innerHTML = list.map(c => {
    const canDel = me && (me.id === c.user_id || me.role === "admin");
    return `
    <div class="comment-item">
      <div class="cm-meta">
        <b>${esc(c.username)}</b> ｜ ${fmtTime(c.created_at)}
        ${canDel ? `<span class="cm-del" onclick="delComment(${c.id})">删除</span>` : ""}
      </div>
      <div class="cm-body">${esc(c.content)}</div>
    </div>`;
  }).join("");
}

async function delComment(id) {
  if (!confirm("确定删除这条评论？")) return;
  const res = await apiFetch("/api/comment/" + id + "/delete", { method: "POST" });
  const data = await res.json();
  if (data.ok) {
    toast("已删除");
    const cRes = await fetch(API + "/api/article/" + currentArticleId + "/comments");
    const cData = await cRes.json();
    renderComments(cData.ok ? cData.comments : []);
  } else {
    toast(data.error || "删除失败");
  }
}

// 提交评论
$("cmtForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!currentArticleId) return;
  if (!me) {
    toast("请先登录");
    closeArticle();
    openModal("login");
    return;
  }
  const content = $("cmtInput").value.trim();
  if (!content) return;

  const btn = e.target.querySelector("button");
  btn.disabled = true;
  try {
    const res = await apiFetch("/api/article/" + currentArticleId + "/comment", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content }),
    });
    const data = await res.json();
    if (data.ok) {
      $("cmtInput").value = "";
      toast("评论成功");
      const cRes = await fetch(API + "/api/article/" + currentArticleId + "/comments");
      const cData = await cRes.json();
      renderComments(cData.ok ? cData.comments : []);
    } else {
      toast(data.error || "评论失败");
    }
  } catch {
    toast("网络错误");
  } finally {
    btn.disabled = false;
  }
});

// ================== 导航 ==================
function renderNav() {
  const nav = $("navActions");
  if (!me) {
    nav.innerHTML = `
      <button class="btn btn-ghost" onclick="openModal('login')">登录</button>
      <button class="btn btn-primary" onclick="openModal('register')">注册</button>`;
    return;
  }
    if (me.banned == 1) {
      nav.innerHTML = `
        <span class="user-chip"><span class="avatar">!</span>账号已被限制</span>
        <button class="btn btn-primary" onclick="window.open('${API}/appeal?token=' + encodeURIComponent(localStorage.getItem('token')||''), '_blank')">申诉</button>
        <button class="btn btn-danger" onclick="logout()">退出</button>`;
      return;
    }
  const adminLink = me.role === "admin"
    ? `<button class="btn btn-ghost" data-action="admin">管理后台</button>` : "";
    nav.innerHTML = `
      <span class="user-chip" style="cursor:pointer" onclick="window.open('${API}/user/${me.id}?token=' + encodeURIComponent(localStorage.getItem('token')||''), '_blank')">
        <span class="avatar">${esc(me.username.slice(0, 1).toUpperCase())}</span>
        ${esc(me.username)}${me.role === "admin" ? " · 管理员" : ""}
      </span>
      <button class="btn btn-primary" data-action="write">写文章</button>
      <button class="btn btn-ghost" data-action="myarticles">我的文章</button>
      ${adminLink}
      <button class="btn btn-danger" onclick="logout()">退出</button>`;
  document.querySelectorAll("[data-action]").forEach(btn => {
    btn.onclick = () => {
      const map = { write: "/article/create", myarticles: "/myarticles", admin: "/admin" };
      const token = localStorage.getItem("token") || "";
      window.open(API + map[btn.dataset.action] + "?token=" + encodeURIComponent(token), "_blank");
    };
  });
}

// ================== 数据加载 ==================
async function loadMe() {
  const token = localStorage.getItem("token");
  if (!token) { me = null; renderNav(); return; }
  try {
    const res = await apiFetch("/api/me");
    if (res.ok) {
      const data = await res.json();
      me = data.ok ? data.user : null;
    } else {
      me = null;
      localStorage.removeItem("token");
    }
  } catch { me = null; }
  renderNav();
}

async function loadItems() {
  const box = $("list");
  try {
    const res = await fetch(API + "/api/items");
    const data = await res.json();
    const rows = data.ok ? data.items : [];
            box.innerHTML = rows.length ? rows.map(r => `
              <article class="card">
                <h3 style="cursor:pointer" onclick="openArticle(${r.id})">${esc(r.title)}</h3>
                <div class="meta">${fmtTime(r.created_at)} ｜
                  <a href="${API}/user/${r.user_id}" target="_blank" style="color:#2563eb;text-decoration:none">${esc(r.username || "匿名")}</a>
                </div>
                <div class="body" style="cursor:pointer" onclick="openArticle(${r.id})">${esc(r.content)}</div>
                <div style="margin-top:10px;font-size:13px">
                  <span style="color:#2563eb;cursor:pointer" onclick="openArticle(${r.id})">查看评论 →</span>
                </div>
              </article>`).join("")
      : `<div class="empty">暂无内容，登录后发布第一篇吧 ✍️</div>`;
  } catch {
    box.innerHTML = `<div class="empty">加载失败：请检查 Worker 是否部署、D1 是否绑定。</div>`;
  }
}

// ================== 登录/注册提交 ==================
$("modalForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const username = $("username").value.trim();
  const password = $("password").value;
  const tip = $("tip");
  tip.className = "tip"; tip.textContent = "";
  $("submitBtn").disabled = true;

  try {
    if (currentType === "login") {
      const res = await apiFetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok && data.ok) {
        if (data.token) localStorage.setItem("token", data.token);
        tip.className = "tip ok"; tip.textContent = "登录成功！";
        toast("登录成功，欢迎回来");
        await loadMe();
        if (!me) {
          tip.className = "tip err";
          tip.textContent = "❌ 登录状态未能保存";
        } else {
          closeModal();
          await loadItems();
        }
      } else {
        tip.className = "tip err";
        tip.textContent = "❌ " + (data.error || "登录失败");
      }
      return;
    }

    // 注册
    const res = await apiFetch("/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok) {
      tip.className = "tip ok"; tip.textContent = "✅ 注册成功，请登录";
      toast("注册成功！");
      setTimeout(() => openModal("login"), 700);
    } else {
      tip.className = "tip err";
      tip.textContent = "❌ " + (data.error || "注册失败");
    }
  } finally {
    $("submitBtn").disabled = false;
  }
});

// ================== 退出 ==================
async function logout() {
  try { await apiFetch("/api/logout", { method: "POST" }); } catch {}
  localStorage.removeItem("token");
  me = null;
  renderNav();
  toast("已退出登录");
}

// ================== 启动 ==================
loadMe();
loadItems();
</script>
</body>
</html>
