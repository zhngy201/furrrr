<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的网页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, Arial, sans-serif;
    }
    body {
      padding: 24px;
      line-height: 1.75;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    /* 头部：电脑左右排布，手机上下堆叠 */
    .header-wrap {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
      gap:20px;
    }
    .title-area h1 {
      font-size: clamp(24px,5vw,34px);
      font-weight: 700;
      margin-bottom:4px;
    }
    .title-area h2 {
      font-size: clamp(16px,3vw,20px);
      font-weight: normal;
      color:#444;
    }
    .nav-buttons {
      display:flex;
      gap:10px;
      flex-shrink:0;
    }
    .nav-buttons > button {
      padding:8px 16px;
      border-radius: 6px;
      font-size:15px;
      cursor:pointer;
    }
    .btn-login {
      background:#ffffff;
      border:1px solid #2372e8;
      color:#2372e8;
    }
    .btn-register {
      background:#2372e8;
      border:1px solid #2372e8;
      color:#fff;
    }
    /* 反馈按钮组，手机自动换行 */
    .action-group {
      margin-bottom:24px;
      display:flex;
      flex-wrap:wrap;
      gap:14px;
    }
    .action-group a {
      display:inline-block;
      padding:10px 20px;
      background:#07c160;
      color:#fff;
      text-decoration:none;
      border-radius:6px;
    }
    hr {
      border:none;
      border-bottom:1px solid #cccccc;
      margin:20px 0 28px;
    }
    .content h2 {
      font-size: clamp(20px,4vw,26px);
      margin-bottom:14px;
    }
    #list {
      padding-left:24px;
      margin-bottom:14px;
    }
    .muted {
      color:#666;
      font-size:14px;
    }
    /* 弹窗 手机适配 */
    .mask {
      position:fixed;
      top:0;left:0;right:0;bottom:0;
      background:rgba(0,0,0,0.45);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999;
      padding:16px;
    }
    .modal-box {
      background:#fff;
      padding:26px;
      border-radius:12px;
      width:100%;
      max-width:360px;
    }
    .modal-box h3{margin-bottom:16px;}
    .modal-box input {
      width:100%;
      padding:11px;
      margin:8px 0;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:15px;
    }
    .modal-box button.submit{
      width:100%;
      padding:11px;
      border:none;
      background:#2277ee;
      color:white;
      border-radius:6px;
      cursor:pointer;
      margin-top:10px;
      font-size:16px;
    }
    .close-btn{
      float:right;
      cursor:pointer;
      font-size:24px;
      color:#777;
    }
    .tip{margin-top:12px;text-align:center;line-height:1.6}
    .tip-success{color:#009944}
    .tip-success a{color:#0066cc}
    .tip-error{color:#dd3333}

    /* 小屏幕：头部改成上下排列 */
    @media (max-width:600px){
      .header-wrap{
        flex-direction:column;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header-wrap">
    <div class="title-area">
      <h1>欢迎来到我的网站</h1>
      <h2>该网站待开发</h2>
    </div>
    <div class="nav-buttons">
      <button class="btn-login" onclick="openModal('login')">登录</button>
      <button class="btn-register" onclick="openModal('register')">注册</button>
    </div>
  </div>

  <div class="action-group">
    <a href="mailto:3660846664@qq.com">邮箱建议（建议电脑）</a>
    <a href="sms:+8615558520933">信息建议（建议手机）</a>
  </div>

  <hr>
  <div class="content">
    <h2>站点公告 / 内容列表</h2>
    <ul id="list"></ul>
    <p class="muted">提示：这里的数据来自 Cloudflare Worker + D1。</p>
    <p class="muted">&copy; 个人网站所有权</p>
  </div>
</div>

  <!--登录注册弹窗-->
  <div class="mask" id="mask">
    <div class="modal-box">
      <span class="close-btn" onclick="closeModal()">×</span>
      <h3 id="modalTitle">账号注册</h3>
      <div id="modalTip" class="tip"></div>
      <form id="modalForm">
        <input type="text" id="username" placeholder="用户名" required>
        <input type="password" id="password" placeholder="密码" required>
        <button class="submit" type="submit">提交</button>
      </form>
    </div>
  </div>

<script>
// ✅ 这里修正API地址！！！
const API = "https://sanq-api.3474662825.workers.dev";
let currentType = "register";

function openModal(type){
  currentType = type;
  document.getElementById("modalTip").innerHTML = "";
  document.getElementById("modalTitle").innerText = type==="register" ? "账号注册":"账号登录";
  document.getElementById("mask").style.display="flex";
}
function closeModal(){
  document.getElementById("mask").style.display="none";
}

function escapeHtml(s) {
  return (s ?? "").toString()
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

async function load() {
  try {
    const res = await fetch(API + "/api/items");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    document.getElementById("list").innerHTML = rows.length
      ? rows.map(r => `
        <li>
          <b>${escapeHtml(r.title)}</b>
          <span class="muted">(${escapeHtml(r.status || "")})</span><br />
          <span>${escapeHtml(r.content || "")}</span>
        </li>
      `).join("")
      : "<li>暂无内容</li>";
  } catch (e) {
    document.getElementById("list").innerHTML =
      "<li>加载失败：请检查 Worker 是否部署、D1 是否绑定、以及是否能访问 API。</li>";
    console.error(e);
  }
}
load();

document.getElementById("modalForm").addEventListener("submit",async function(e){
  e.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const tipDom = document.getElementById("modalTip");
  tipDom.innerHTML = "";

  const fd = new FormData();
  fd.append("username",username);
  fd.append("password",password);

  const url = currentType === "register" ? `${API}/register` : `${API}/login`;
  const resp = await fetch(url, {
    method:"POST",
    body:fd,
    credentials:"include"
  });

  if(resp.ok){
    tipDom.className = "tip tip-success";
    if(currentType==="register"){
      tipDom.innerHTML = "✅注册成功！<br><a target='_blank' href='https://zhij-api.3474662825.workers.dev/login'>👉点击跳转去登录发文</a>";
    }else{
      tipDom.innerText = "⚠️登录请打开上面链接，本页面无法跨域保存登录状态";
    }
  }else{
    tipDom.className = "tip tip-error";
    if(currentType==="register"){
      tipDom.innerText = "❌注册失败，用户名已存在";
    }else{
      tipDom.innerText = "❌账号密码错误";
    }
  }
});

document.getElementById("mask").onclick = function(e){
  if(e.target === this) closeModal();
}
</script>
</body>
</html>
