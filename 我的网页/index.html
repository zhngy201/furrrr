<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的网页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, Arial, sans-serif;
    }
    body {
      padding: 30px;
      line-height: 1.7;
    }
    /* 右上角导航 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom:30px;
    }
    .nav-btn-group > button {
      padding:8px 16px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-size:15px;
      margin-left:8px;
    }
    .btn-login {
      background:#fff;
      border:1px solid #2277ee !important;
      color:#2277ee;
    }
    .btn-register {
      background:#2277ee;
      color:white;
    }
    /* 弹窗遮罩 */
    .mask {
      position:fixed;
      top:0;left:0;right:0;bottom:0;
      background:rgba(0,0,0,0.45);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999;
    }
    .modal-box {
      background:#fff;
      padding:24px;
      border-radius:10px;
      width: 360px;
    }
    .modal-box h3{margin-bottom:16px;}
    .modal-box input {
      width:100%;
      padding:10px;
      margin:8px 0;
      border:1px solid #ccc;
      border-radius:5px;
      font-size:15px;
    }
    .modal-box button.submit{
      width:100%;
      padding:10px;
      border:none;
      background:#2277ee;
      color:white;
      border-radius:5px;
      cursor:pointer;
      margin-top:8px;
      font-size:15px;
    }
    .close-btn{
      float:right;
      cursor:pointer;
      font-size:22px;
      color:#777;
    }
    .tip{margin-top:10px;text-align:center;}
    .tip-success{color:#009944}
    .tip-error{color:#dd3333}
    .content{
      max-width:900px;
    }
    .action-buttons{
      margin:20px 0;
    }
    .action-buttons a{
      display:inline-block;
      padding:12px 22px;
      background:#07c160;
      color:white;
      text-decoration:none;
      border-radius:6px;
      margin-right:12px;
    }
    ul#list{
      margin:20px 0;
      padding-left:22px;
    }
    .muted{color:#666;font-size:14px}
  </style>
</head>
<body>
  <div class="header-bar">
    <div>
      <h1>欢迎来到我的网站</h1>
      <h2 style="font-weight:normal;margin-top:6px;">该网站待开发</h2>
    </div>
    <!-- 右上角按钮 -->
    <div class="nav-btn-group">
      <button class="btn-login" onclick="openModal('login')">登录</button>
      <button class="btn-register" onclick="openModal('register')">注册</button>
    </div>
  </div>

  <div class="content">
    <div class="action-buttons">
      <a href="mailto:3660846664@qq.com">邮箱建议（建议电脑）</a>
      <a href="sms:+8615558520933">信息建议（建议手机）</a>
    </div>

    <hr>
    <h2>站点公告 / 内容列表</h2>
    <ul id="list"></ul>
    <p class="muted">提示：这里的数据来自 Cloudflare Worker + D1。</p>
    <p class="muted">&copy; 个人网站所有权</p>
  </div>


  <!-- ==========弹窗（登录+注册共用弹窗）========== -->
  <div class="mask" id="mask">
    <div class="modal-box">
      <span class="close-btn" onclick="closeModal()">×</span>
      <h3 id="modalTitle">账号注册</h3>
      <div id="modalTip" class="tip"></div>
      <form id="modalForm">
        <input type="text" id="username" placeholder="用户名" required>
        <input type="password" id="password" placeholder="密码" required>
        <button class="submit" type="submit">提交</button>
      </form>
    </div>
  </div>

<script>
const API = "https://zhij-api.3474662825.workers.dev";
let currentType = "register";

//打开弹窗
function openModal(type){
  currentType = type;
  document.getElementById("modalTip").innerHTML = "";
  document.getElementById("modalTitle").innerText = type==="register" ? "账号注册":"账号登录";
  document.getElementById("mask").style.display="flex";
}
function closeModal(){
  document.getElementById("mask").style.display="none";
}

//HTML转义
function escapeHtml(s) {
  return (s ?? "").toString()
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

//加载文章列表
async function load() {
  try {
    const res = await fetch(API + "/api/items");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    document.getElementById("list").innerHTML = rows.length
      ? rows.map(r => `
        <li>
          <b>${escapeHtml(r.title)}</b>
          <span class="muted">(${escapeHtml(r.status || "")})</span><br />
          <span>${escapeHtml(r.content || "")}</span>
        </li>
      `).join("")
      : "<li>暂无内容</li>";
  } catch (e) {
    document.getElementById("list").innerHTML =
      "<li>加载失败：请检查 Worker 是否部署、D1 是否绑定、以及是否能访问 API。</li>";
    console.error(e);
  }
}
load();

//表单提交
document.getElementById("modalForm").addEventListener("submit",async function(e){
  e.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const tipDom = document.getElementById("modalTip");
  tipDom.innerHTML = "";

  const fd = new FormData();
  fd.append("username",username);
  fd.append("password",password);

  const url = currentType === "register" ? `${API}/register` : `${API}/login`;
  const resp = await fetch(url, {
    method:"POST",
    body:fd,
    credentials:"include"
  });
  const text = await resp.text();

  if(resp.ok){
    tipDom.className = "tip tip-success";
    if(currentType==="register"){
      tipDom.innerText = "✅注册成功！可以去登录";
    }else{
      tipDom.innerText = "✅登录成功！";
    }
  }else{
    tipDom.className = "tip tip-error";
    if(currentType==="register"){
      tipDom.innerText = "❌注册失败，用户名已存在";
    }else{
      tipDom.innerText = "❌账号密码错误";
    }
  }
});

//点击遮罩关闭弹窗
document.getElementById("mask").onclick = function(e){
  if(e.target === this) closeModal();
}
</script>
</body>
</html>
